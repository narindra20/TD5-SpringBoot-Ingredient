/ingredients/{id}/stock:
  get:
    tags: [Ingredients]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

      - name: at
        in: query
        required: true
        schema:
          type: string
          format: date-time

      - name: unit
        in: query
        required: true
        schema:
          type: string
          enum: [KG, L, PCS]

    responses:
      200:
        description: Stock value
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockResponse'

      400:
        description: Missing query parameter
        content:
          text/plain:
            schema:
              type: string
              example: Either mandatory query parameter `at` or `unit` is not provided.

      404:
        description: Ingredient not found
        content:
          text/plain:
            schema:
              type: string
              example: Ingredient.id=1 is not found