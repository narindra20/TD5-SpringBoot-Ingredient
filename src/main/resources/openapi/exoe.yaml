/dishes/{id}/ingredients:
  put:
    tags: [Dishes]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Ingredient'

    responses:
      200:
        description: Updated dish
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dish'

      400:
        description: Missing body
        content:
          text/plain:
            schema:
              type: string
              example: Request body is required

      404:
        description: Dish not found
        content:
          text/plain:
            schema:
              type: string
              example: Dish.id=1 is not found